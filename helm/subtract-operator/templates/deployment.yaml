apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-subtract
  namespace: {{ .Values.namespace }}
  labels:
    app: calculator
    component: operator
    operator: subtract
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: calculator
      component: operator
      operator: subtract
  template:
    metadata:
      labels:
        app: calculator
        component: operator
        operator: subtract
    spec:
      containers:
      - name: subtract-operator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: calculator-config
        env:
        - name: WORKER_TASK_QUEUE
          value: {{ .Values.taskQueue }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}